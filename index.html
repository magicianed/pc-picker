<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>PC Picker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230a0a0a'/><rect x='5' y='15' width='22' height='2' rx='1' fill='%23fff'/><circle cx='19' cy='16' r='5' fill='%23fff'/></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #101010;
    --line: #262626;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --white: #ffffff;
    --green: #3dff8f;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --r: 24px;
  }

  ::selection { background: var(--white); color: var(--bg); }
  :focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
    min-height: 100dvh;
  }

  main {
    width: 100%;
    max-width: 860px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding: clamp(24px, 5vh, 56px) 24px max(24px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 3.6vh, 36px);
  }

  /* price + score */

  .price, .score { font-variant-numeric: tabular-nums; letter-spacing: -0.035em; line-height: 1.05; }

  .price {
    font-size: clamp(48px, 10vw, 84px);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.22em;
  }

  .star {
    width: 0.52em; height: 0.52em;
    fill: var(--white);
    transform: scale(0) rotate(-90deg);
    transition: transform 0.5s var(--ease);
  }
  .starred .star { transform: none; }

  .score {
    margin-top: 10px;
    font-size: clamp(26px, 5.4vw, 44px);
    font-weight: 500;
  }
  .score small { font-size: inherit; font-weight: 400; color: var(--muted); }

  /* photo + specs */

  .pc {
    display: grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: clamp(16px, 4vw, 36px);
    align-items: center;
    transition: opacity 0.18s var(--ease), transform 0.18s var(--ease);
  }
  .pc.swap { opacity: 0; transform: translateY(8px); }

  .photo {
    appearance: none;
    font: inherit; color: inherit;
    width: 100%;
    aspect-ratio: 1;
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
    padding: clamp(8px, 2vw, 20px);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.3s var(--ease), transform 0.4s var(--ease);
  }
  .photo.light { background: var(--white); }
  .photo:hover { border-color: var(--white); transform: translateY(-4px); }
  .photo:active { transform: scale(0.985); }
  .photo img { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 12px; }

  .name { font-size: 15px; font-weight: 600; margin-bottom: 12px; text-wrap: balance; }

  dl { display: grid; gap: 8px; font-size: 13px; line-height: 1.4; }
  dl div { display: grid; grid-template-columns: 56px 1fr; gap: 10px; }
  dt { color: var(--muted); }

  /* slider */

  .slider { margin-top: auto; padding-top: 8px; }

  .track { position: relative; height: 36px; touch-action: none; cursor: pointer; }
  .track::before {
    content: "";
    position: absolute; left: 0; right: 0; top: 15px; height: 6px;
    border-radius: 3px;
    background: var(--line);
  }
  .fill {
    position: absolute; left: 0; top: 15px; height: 6px; width: 0;
    border-radius: 3px;
    background: var(--white);
  }
  .thumb {
    position: absolute; top: 4px; left: 0;
    width: 28px; height: 28px; margin-left: -14px;
    border-radius: 50%;
    background: var(--white);
    cursor: grab;
    transition: transform 0.25s var(--ease);
  }
  .track.drag, .track.drag .thumb { cursor: grabbing; }
  .track.drag .thumb { transform: scale(1.18); }
  .snap .thumb { transition: left 0.45s var(--ease), transform 0.25s var(--ease); }
  .snap .fill { transition: width 0.45s var(--ease); }

  .inset { margin: 0 18px; }

  .ticks { position: relative; height: 44px; }
  .ticks button {
    position: absolute; top: 4px;
    transform: translateX(-50%);
    min-width: 40px; min-height: 36px;
    border: 0; border-radius: 10px; background: none;
    font: 500 12px/1 var(--mono);
    color: var(--muted);
    cursor: pointer;
    transition: color 0.25s var(--ease);
  }
  .ticks button:hover, .ticks button.on { color: var(--white); }
  .ticks button span { display: block; height: 12px; font-size: 10px; }

  /* buttons */

  .btn {
    appearance: none;
    width: 100%;
    padding: 18px 20px;
    border: 1px solid var(--white);
    border-radius: 18px;
    background: var(--white);
    color: var(--bg);
    font: 600 16px/1 var(--sans);
    cursor: pointer;
    transition: background 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease), transform 0.25s var(--ease);
  }
  .btn:hover { background: var(--bg); color: var(--white); }
  .btn:active { transform: scale(0.985); }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--white); }

  .note { font-size: 12px; line-height: 1.5; color: var(--muted); text-align: center; }

  /* popup */

  dialog {
    margin: auto;
    width: min(420px, calc(100vw - 40px));
    border: 1px solid var(--line);
    border-radius: var(--r);
    background: var(--surface);
    color: var(--text);
    padding: 30px 26px 26px;
    text-align: center;
  }
  dialog[open] { animation: pop 0.35s var(--ease); }
  dialog::backdrop { background: rgba(0, 0, 0, 0.72); }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(0.97); } }

  dialog p { font-size: 15px; line-height: 1.55; }

  .code {
    appearance: none;
    display: block;
    width: 100%;
    margin: 18px 0 6px;
    padding: 10px 0;
    border: 0; border-radius: 12px; background: none;
    font: 700 clamp(26px, 8vw, 36px)/1.1 var(--mono);
    letter-spacing: 0.06em;
    color: var(--green);
    text-shadow: 0 0 8px rgba(61, 255, 143, 0.75), 0 0 26px rgba(61, 255, 143, 0.45);
    cursor: pointer;
  }
  .hint { color: var(--muted); font-size: 12px !important; min-height: 19px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }

  @media (max-width: 480px) {
    .pc { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 14px; }
    dl { font-size: 12px; gap: 6px; }
    dl div { grid-template-columns: 42px 1fr; gap: 6px; }
    .name { font-size: 13px; margin-bottom: 8px; }
    .ticks button { font-size: 11px; min-width: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="price" id="price"><span id="priceText"></span>
      <svg class="star" viewBox="0 0 24 24" role="img" aria-label="Preferred PC"><path d="M12 1.8l3.1 6.5 7.1.9-5.2 4.9 1.3 7.1L12 17.8l-6.3 3.4L7 14.1 1.8 9.2l7.1-.9z"/></svg>
    </div>
    <div class="score"><span id="score"></span> <small id="pct"></small></div>
  </header>

  <section class="pc" id="pc" aria-live="polite">
    <button class="photo" id="photo" type="button"><img id="img" alt=""></button>
    <div>
      <div class="name" id="name"></div>
      <dl id="specs"></dl>
    </div>
  </section>

  <div class="slider">
    <div class="inset">
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
        <div class="thumb" id="thumb" role="slider" tabindex="0" aria-label="Price"></div>
      </div>
      <div class="ticks" id="ticks"></div>
    </div>
  </div>

  <button class="btn" id="go" type="button">Redirect to PC</button>
  <p class="note">Estimated score. Prices before tax, checked Nov 24, 2026.</p>
</main>

<dialog id="pop" aria-labelledby="popText">
  <p id="popText"></p>
  <button class="code" id="code" type="button"></button>
  <p class="hint" id="hint"></p>
  <div class="row">
    <button class="btn ghost" id="cancel" type="button">Cancel</button>
    <button class="btn" id="redirect" type="button">Redirect</button>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  var CP = "https://www.cyberpowerpc.com/";
  var WHITE_CASE = CP + "images/cs/amethyst240s/wht_sitewide_800x800.png";
  function build(id) { return CP + "cart/editsystem.aspx?id=" + id; }

  // To update a PC, edit its entry here. "point" is the slider stop, "price" is
  // what you really pay after the code, "raw" is the estimated speed.
  var PCS = [
    { point: 1000, price: 1049.99, raw: 97.0, name: "Stormcraft Sirius",
      img: "https://c1.neweggimages.com/productimage/nb640/83-420-040-33.jpg", light: true,
      url: "https://www.newegg.com/stormcraft-sirius-gaming-desktop-pc-geforce-rtx-5060-intel-core-i5-14400f-16gb-ddr4-1tb-ssd-si1440fbb-560n2/p/N82E16883420040",
      specs: { CPU: "Core i5-14400F", GPU: "RTX 5060 8GB", RAM: "16GB DDR4", SSD: "1TB", PSU: "650W", Store: "Newegg" } },

    { point: 1250, price: 1311.00, raw: 116.9, name: "CyberPowerPC custom", code: "BLACKFRIDAY", list: 1380,
      img: CP + "images/cs/javelin240v/wht_sitewide_400x400.png", url: build(18205545),
      specs: { CPU: "Ryzen 7 8700F", GPU: "RX 9070 GRE 12GB", RAM: "16GB DDR5", SSD: "1TB", PSU: "600W", Store: "CyberPowerPC" } },

    { point: 1500, price: 1498.15, raw: 142.7, name: "CyberPowerPC custom", code: "BLACKFRIDAY", list: 1577,
      img: WHITE_CASE, url: build(18205537),
      specs: { CPU: "Ryzen 7 7800X3D", GPU: "RX 9070 GRE 12GB", RAM: "16GB DDR5", SSD: "1TB", PSU: "800W", Store: "CyberPowerPC" } },

    { point: 1650, price: 1669.15, raw: 147.1, name: "CyberPowerPC custom", code: "BLACKFRIDAY", list: 1757,
      img: WHITE_CASE, url: build(18205503),
      specs: { CPU: "Ryzen 7 7800X3D", GPU: "RX 9070 GRE 12GB", RAM: "32GB DDR5", SSD: "1TB", PSU: "800W", Store: "CyberPowerPC" } },

    { point: 1750, price: 1849.99, raw: 168.6, name: "CyberPowerPC at Best Buy", star: true,
      img: "https://pisces.bbystatic.com/image2/BestBuy_US/images/products/6668/6668823_sd.jpg", light: true,
      url: "https://www.bestbuy.com/product/cyberpowerpc-gaming-desktop-amd-ryzen-7-9800x3d-2024-amd-radeon-rx-9070-16gb-32gb-ddr5-memory-1tb-ssd-storage-black/J3L7GQWRZC",
      specs: { CPU: "Ryzen 7 9800X3D", GPU: "RX 9070 16GB", RAM: "32GB DDR5", SSD: "1TB", PSU: "850W", Store: "Best Buy" } },

    { point: 2000, price: 2073.85, raw: 177.0, name: "CyberPowerPC custom", code: "BLACKFRIDAY", list: 2183,
      img: WHITE_CASE, url: build(18205542),
      specs: { CPU: "Ryzen 7 9800X3D", GPU: "RX 9070 XT 16GB", RAM: "16GB DDR5", SSD: "1TB", PSU: "800W", Store: "CyberPowerPC" } },

    { point: 2250, price: 2244.85, raw: 182.5, name: "CyberPowerPC custom", code: "BLACKFRIDAY", list: 2363,
      img: WHITE_CASE, url: build(18205540),
      specs: { CPU: "Ryzen 7 9800X3D", GPU: "RX 9070 XT 16GB", RAM: "32GB DDR5", SSD: "1TB", PSU: "800W", Store: "CyberPowerPC" } }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var last = PCS.length - 1;
  var lowest = PCS[0].raw;
  var best = Math.max.apply(null, PCS.map(function (p) { return p.raw; }));
  var still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  var current = -1, shown = 0, swapTimer = 0, tween = 0;

  function money(n) {
    return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function countTo(target) {
    cancelAnimationFrame(tween);
    var from = shown, t0 = performance.now();
    if (still || !from || document.hidden) { shown = target; $("priceText").textContent = money(target); return; }
    (function step(now) {
      var k = Math.min(1, (now - t0) / 350);
      shown = from + (target - from) * (1 - Math.pow(1 - k, 3));
      if (k === 1) shown = target;
      $("priceText").textContent = money(shown);
      if (k < 1) tween = requestAnimationFrame(step);
    })(t0);
  }

  function fillCard(p) {
    $("img").src = p.img;
    $("img").alt = p.name;
    $("photo").classList.toggle("light", !!p.light);
    $("photo").setAttribute("aria-label", "Redirect to " + p.name);
    $("name").textContent = p.name;
    $("specs").textContent = "";
    Object.keys(p.specs).forEach(function (k) {
      var d = document.createElement("div"), dt = document.createElement("dt"), dd = document.createElement("dd");
      dt.textContent = k; dd.textContent = p.specs[k];
      d.append(dt, dd); $("specs").append(d);
    });
  }

  function show(i) {
    if (i === current) return;
    var first = current < 0, p = PCS[i];
    current = i;

    countTo(p.price);
    $("price").classList.toggle("starred", !!p.star);
    $("score").textContent = "Performance " + Math.round(p.raw / best * 100);
    $("pct").textContent = "(+" + Math.round((p.raw / lowest - 1) * 100) + "%)";

    [].forEach.call($("ticks").children, function (b, n) { b.classList.toggle("on", n === i); });
    var t = $("thumb");
    t.setAttribute("aria-valuemin", PCS[0].point);
    t.setAttribute("aria-valuemax", PCS[last].point);
    t.setAttribute("aria-valuenow", p.point);
    t.setAttribute("aria-valuetext", money(p.price) + ", " + p.name + (p.star ? ", preferred" : ""));

    clearTimeout(swapTimer);
    if (first || still) { fillCard(p); $("pc").classList.remove("swap"); return; }
    $("pc").classList.add("swap");
    swapTimer = setTimeout(function () { fillCard(p); $("pc").classList.remove("swap"); }, 170);
  }

  // slider: 0..1 along the track, snaps to the nearest stop on release

  function place(f) {
    $("thumb").style.left = f * 100 + "%";
    $("fill").style.width = f * 100 + "%";
  }
  function snapTo(i) {
    $("track").classList.add("snap");
    place(i / last);
    show(i);
  }
  function at(e) {
    var r = $("track").getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  }

  var dragging = false, frac = 0;
  function move(e) { frac = at(e); place(frac); show(Math.round(frac * last)); }

  $("track").addEventListener("pointerdown", function (e) {
    if (e.button) return;
    dragging = true;
    try { $("track").setPointerCapture(e.pointerId); } catch (err) {}
    $("track").classList.remove("snap");
    $("track").classList.add("drag");
    move(e);
    $("thumb").focus({ preventScroll: true });
    e.preventDefault();
  });
  $("track").addEventListener("pointermove", function (e) { if (dragging) move(e); });
  ["pointerup", "pointercancel"].forEach(function (n) {
    $("track").addEventListener(n, function () {
      if (!dragging) return;
      dragging = false;
      $("track").classList.remove("drag");
      snapTo(Math.round(frac * last));
    });
  });

  $("thumb").addEventListener("keydown", function (e) {
    var to = { ArrowRight: current + 1, ArrowUp: current + 1, ArrowLeft: current - 1, ArrowDown: current - 1, Home: 0, End: last }[e.key];
    if (to === undefined) return;
    e.preventDefault();
    snapTo(Math.min(last, Math.max(0, to)));
  });

  PCS.forEach(function (p, i) {
    var b = document.createElement("button"), s = document.createElement("span");
    b.type = "button";
    b.style.left = i / last * 100 + "%";
    s.textContent = p.star ? "★" : "";
    b.append(s, "$" + p.point);
    b.addEventListener("click", function () { snapTo(i); });
    $("ticks").append(b);
  });

  // redirect, with the code popup when the price needs one

  function open(p) { window.open(p.url, "_blank", "noopener"); }

  function go() {
    var p = PCS[current];
    if (!p.code) { open(p); return; }
    $("popText").textContent = "For this PC to match the right price (" + money(p.price) + "), it requires this code at checkout:";
    $("code").textContent = p.code;
    $("hint").textContent = "Tap the code to copy";
    $("pop").showModal();
  }

  $("go").addEventListener("click", go);
  $("photo").addEventListener("click", go);
  $("cancel").addEventListener("click", function () { $("pop").close(); });
  $("redirect").addEventListener("click", function () { $("pop").close(); open(PCS[current]); });
  $("pop").addEventListener("click", function (e) { if (e.target === $("pop")) $("pop").close(); });
  $("code").addEventListener("click", function () {
    navigator.clipboard.writeText($("code").textContent).then(
      function () { $("hint").textContent = "Copied"; },
      function () { $("hint").textContent = "Couldn't copy, type it in at checkout"; });
  });

  var start = PCS.findIndex(function (p) { return p.star; });
  place(start / last);
  show(start);

  // load the other photos ahead of time so the slider never waits on one
  addEventListener("load", function () { PCS.forEach(function (p) { new Image().src = p.img; }); });
})();
</script>
</body>
</html>
